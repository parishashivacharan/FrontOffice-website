<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;">
  <!-- Background border -->
  <rect x="2" y="2" width="956" height="536" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="40" y="48" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#0a0a0a">01. STUDENT PORTAL WORKFLOW &amp; PROFILE VERIFICATION</text>
  <text x="40" y="72" font-family="sans-serif" font-size="13" fill="#6a6a6a">Xiaohei (小黑) completing roll number setup, unlocking 4 simulation universes &amp; task submission</text>

  <line x1="40" y1="88" x2="920" y2="88" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Step 1 Box: Login & Profile Verification -->
  <rect x="40" y="120" width="260" height="280" rx="14" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="60" y="140" width="130" height="24" rx="6" fill="#0a0a0a"/>
  <text x="70" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">STEP 1: PROFILE SETUP</text>
  <text x="60" y="195" font-family="monospace" font-size="13" font-weight="bold" fill="#0a0a0a">Council Roll # Input</text>
  <rect x="60" y="205" width="220" height="32" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="72" y="226" font-family="monospace" font-size="12" fill="#2563eb">Roll: 123456789</text>
  
  <text x="60" y="260" font-family="monospace" font-size="13" font-weight="bold" fill="#0a0a0a">Batch Selection</text>
  <rect x="60" y="270" width="220" height="32" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="72" y="291" font-family="monospace" font-size="12" fill="#0a0a0a">Assigned: Batch A</text>

  <rect x="60" y="325" width="220" height="45" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="75" y="352" font-family="monospace" font-size="13" font-weight="bold" fill="#10b981">✓ VERIFIED &amp; ACTIVE</text>

  <!-- Flow Arrow 1 -->
  <path d="M310,260 L360,260" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="360,252 375,260 360,268" fill="#0a0a0a"/>

  <!-- Step 2 Box: 4 Simulation Universes & Units -->
  <rect x="380" y="120" width="260" height="280" rx="14" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="400" y="140" width="160" height="24" rx="6" fill="#0a0a0a"/>
  <text x="410" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">STEP 2: 4 UNIVERSES</text>

  <rect x="400" y="180" width="220" height="36" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="412" y="203" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">U1: Market Benchmark</text>

  <rect x="400" y="225" width="220" height="36" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="412" y="248" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">U2: Competitive Dynamics</text>

  <rect x="400" y="270" width="220" height="36" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="412" y="293" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">U3: Yield Optimization</text>

  <rect x="400" y="315" width="220" height="36" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="412" y="338" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">U4: Strategic Positioning</text>

  <!-- Flow Arrow 2 -->
  <path d="M650,260 L700,260" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="700,252 715,260 700,268" fill="#0a0a0a"/>

  <!-- Step 3 Box: Task Submissions -->
  <rect x="720" y="120" width="200" height="280" rx="14" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="735" y="140" width="170" height="24" rx="6" fill="#0a0a0a"/>
  <text x="745" y="156" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">STEP 3: TASK SUBMISSION</text>

  <text x="735" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0a0a0a">Front Office Case Study</text>
  <rect x="735" y="205" width="170" height="80" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="745" y="225" font-family="monospace" font-size="10" fill="#6a6a6a">Text response or PDF...</text>

  <rect x="735" y="300" width="170" height="36" rx="6" fill="#0a0a0a"/>
  <text x="760" y="323" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Submit Task →</text>

  <!-- Xiaohei (小黑) Character bottom center -->
  <ellipse cx="200" cy="460" rx="18" ry="26" fill="#0a0a0a"/>
  <circle cx="200" cy="425" r="14" fill="#0a0a0a"/>
  <circle cx="195" cy="422" r="2" fill="#ffffff"/>
  <circle cx="205" cy="422" r="2" fill="#ffffff"/>
  <line x1="190" y1="484" x2="185" y2="520" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  <line x1="210" y1="484" x2="215" y2="520" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  <path d="M215,445 Q260,420 300,410" fill="none" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Annotation Handwritten style -->
  <text x="315" y="470" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#ef4444">小黑 (Xiaohei): Profile completion unlocks all 4 simulation universes &amp; task submission!</text>
</svg>
