<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;">
  <!-- Background border -->
  <rect x="2" y="2" width="956" height="536" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="40" y="48" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#0a0a0a">02. TEACHER FACULTY PORTAL &amp; EVALUATION WORKFLOW</text>
  <text x="40" y="72" font-family="sans-serif" font-size="13" fill="#6a6a6a">Mr. Rajesh managing tasks, resource uploads (Units 1, 2, 3, 5), attendance &amp; batch grading</text>

  <line x1="40" y1="88" x2="920" y2="88" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Section A: Task & Resource Creation -->
  <rect x="40" y="120" width="270" height="280" rx="14" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="60" y="140" width="180" height="24" rx="6" fill="#0a0a0a"/>
  <text x="70" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">A. TASKS &amp; PDF RESOURCES</text>

  <text x="60" y="195" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">Target Course (Custom Input)</text>
  <rect x="60" y="205" width="230" height="32" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="72" y="226" font-family="monospace" font-size="11" fill="#0a0a0a">Front Office Operations</text>

  <text x="60" y="260" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">Unit Name (Custom Input)</text>
  <rect x="60" y="270" width="230" height="32" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="72" y="291" font-family="monospace" font-size="11" fill="#2563eb">Unit 1 / Unit 2 / Unit 3 / Unit 5</text>

  <rect x="60" y="320" width="230" height="40" rx="6" fill="#0a0a0a"/>
  <text x="80" y="345" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Upload PDF &amp; Notify All →</text>

  <!-- Flow Arrow 1 -->
  <path d="M320,260 L370,260" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="370,252 385,260 370,268" fill="#0a0a0a"/>

  <!-- Section B: Batch Attendance Tracking -->
  <rect x="390" y="120" width="250" height="280" rx="14" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="410" y="140" width="180" height="24" rx="6" fill="#0a0a0a"/>
  <text x="420" y="156" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">B. DATE &amp; BATCH ATTENDANCE</text>

  <text x="410" y="195" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">Select Session Date</text>
  <rect x="410" y="205" width="210" height="32" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="422" y="226" font-family="monospace" font-size="11" fill="#0a0a0a">2026-07-29</text>

  <text x="410" y="260" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">Select Batch (A, B, C, D)</text>
  <rect x="410" y="270" width="210" height="32" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="422" y="291" font-family="monospace" font-size="11" fill="#0a0a0a">Batch A (S.No 1-26)</text>

  <rect x="410" y="320" width="210" height="40" rx="6" fill="#22c55e"/>
  <text x="435" y="345" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Submit Batch Attendance</text>

  <!-- Flow Arrow 2 -->
  <path d="M650,260 L700,260" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round"/>
  <polygon points="700,252 715,260 700,268" fill="#0a0a0a"/>

  <!-- Section C: Batch Submissions & Grading -->
  <rect x="720" y="120" width="200" height="280" rx="14" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
  <rect x="735" y="140" width="170" height="24" rx="6" fill="#0a0a0a"/>
  <text x="745" y="156" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">C. STUDENT SUBMISSIONS</text>

  <text x="735" y="195" font-family="monospace" font-size="11" fill="#6a6a6a">Task: Yield Case Study</text>
  <rect x="735" y="205" width="170" height="40" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="2"/>
  <text x="745" y="228" font-family="monospace" font-size="10" fill="#2563eb">Roll #123456789 (Submitted)</text>

  <rect x="735" y="255" width="170" height="45" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="745" y="282" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">Score: 28 / 30</text>

  <rect x="735" y="315" width="170" height="35" rx="6" fill="#0a0a0a"/>
  <text x="760" y="337" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff">Save Evaluation</text>

  <!-- Xiaohei (小黑) Teacher Figure bottom center -->
  <ellipse cx="500" cy="460" rx="18" ry="26" fill="#0a0a0a"/>
  <circle cx="500" cy="425" r="14" fill="#0a0a0a"/>
  <circle cx="495" cy="422" r="2" fill="#ffffff"/>
  <circle cx="505" cy="422" r="2" fill="#ffffff"/>
  <line x1="490" y1="484" x2="485" y2="520" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  <line x1="510" y1="484" x2="515" y2="520" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Annotation Handwritten style -->
  <text x="540" y="470" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">小黑 (Xiaohei): Mr. Rajesh manages resources, attendance &amp; evaluates batch submissions!</text>
</svg>
