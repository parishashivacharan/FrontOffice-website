  <line x1="40" y1="88" x2="920" y2="88" stroke="#0a0a0a" stroke-width="2"/>

  <!-- Left Card: Batch Roster Distribution -->
  <rect x="40" y="120" width="420" height="280" rx="14" fill="#fafafa" stroke="#0a0a0a" stroke-width="3"/>
