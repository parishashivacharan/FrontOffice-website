  <text x="320" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#2563eb">26 Students</text>

  <!-- Batch C Row -->
  <rect x="60" y="280" width="380" height="40" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
  <text x="75" y="305" font-family="monospace" font-size="12" font-weight="bold" fill="#0a0a0a">BATCH C (S.No 53 - 78)</text>
  <text x="320" y="305" font-family="monospace" font-size="12" font-weight="bold" fill="#2563eb">26 Students</text>

