  <rect x="520" y="335" width="380" height="45" rx="8" fill="#0a0a0a"/>
  <text x="610" y="362" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Overall System Status: Optimal</text>

  <!-- Xiaohei (小黑) Admin Figure bottom center -->
  <ellipse cx="480" cy="460" rx="18" ry="26" fill="#0a0a0a"/>
  <circle cx="480" cy="425" r="14" fill="#0a0a0a"/>
  <circle cx="475" cy="422" r="2" fill="#ffffff"/>
  <circle cx="485" cy="422" r="2" fill="#ffffff"/>
  <line x1="470" y1="484" x2="465" y2="520" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>
  <line x1="490" y1="484" x2="495" y2="520" stroke="#0a0a0a" stroke-width="3" stroke-linecap="round"/>

  <!-- Annotation Handwritten style -->
  <text x="520" y="470" font-family="'Comic Sans MS', cursive, sans-serif" font-size="13" font-weight="bold" fill="#0a0a0a">小黑 (Xiaohei): Institute Admin monitoring total roster, faculty &amp; campus analytics!</text>
