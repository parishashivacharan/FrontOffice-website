<svg viewBox="0 0 960 540" width="960" height="540" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff;">
  <!-- Background border -->
  <rect x="2" y="2" width="956" height="536" rx="16" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>

  <!-- Title Banner -->
  <text x="40" y="48" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="bold" fill="#0a0a0a">03. INSTITUTE ADMIN &amp; CAMPUS OVERVIEW DASHBOARD</text>
