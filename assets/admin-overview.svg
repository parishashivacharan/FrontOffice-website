  <text x="320" y="205" font-family="monospace" font-size="12" font-weight="bold" fill="#2563eb">26 Students</text>

  <!-- Batch B Row -->
  <rect x="60" y="230" width="380" height="40" rx="6" fill="#ffffff" stroke="#e5e5e5" stroke-width="2"/>
